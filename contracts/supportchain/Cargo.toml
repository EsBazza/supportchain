[package]
name = "supportchain"
version = "0.1.0"
edition = "2021"
description = "Automated child support enforcement via Soroban smart contracts on Stellar"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }